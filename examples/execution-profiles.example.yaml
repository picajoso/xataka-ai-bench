# Copy this file to /Volumes/MacOS_VMs/xataka-ai-bench/state/execution-profiles.yaml.
# It contains identifiers and permitted variable names only: never put key values here.
schemaVersion: 1.0.0
profiles:
  - systemSlug: opencode-qwen38-ninfer-medium
    adapter: opencode
    model: replace-with-your-opencode-provider/model
    variant: medium
    # Relative to the directory containing execution-profiles.yaml. This file stays private.
    # Its provider baseURL must use http://inference.local:8080/v1, never the LAN address.
    opencodeConfigPath: configs/ninfer-opencode.json
    endpoint:
      # Private LAN target. Do not use a URL or commit a real value.
      alias: inference.local
      host: 192.168.0.10
      port: 1234
    environmentVariables:
      - NINFER_API_KEY
